<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Upload Official Receipt</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         RECEIPT POPUP
    ========================== -->

    <div class="receipt-modal">

        <!-- HEADER -->
        <div class="modal-header-custom">

            <h1>Upload Official Receipt</h1>

            <!-- Protocol Number -->
            <div class="protocol">
                Protocol No. __________
            </div>

            <!-- DATE + AMOUNT -->
            <div class="receipt-details">

                <!-- Date -->
                <div class="detail-item">

                    <!-- Calendar Button -->
                    <label for="receiptDate" class="calendar-button">

                        <svg xmlns="http://www.w3.org/2000/svg"
                             width="16"
                             height="16"
                             fill="currentColor"
                             class="bi bi-calendar-week"
                             viewBox="0 0 16 16">

                            <path d="M11 6.5a.5.5 0 0 1 .5-.5h1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-1a.5.5 0 0 1-.5-.5zm-3 0a.5.5 0 0 1 .5-.5h1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-1a.5.5 0 0 1-.5-.5zm-5 3a.5.5 0 0 1 .5-.5h1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-1a.5.5 0 0 1-.5-.5zm3 0a.5.5 0 0 1 .5-.5h1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-1a.5.5 0 0 1-.5-.5z"/>

                            <path d="M3.5 0a.5.5 0 0 1 .5.5V1h8V.5a.5.5 0 0 1 1 0V1h1a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V3a2 2 0 0 1 2-2h1V.5a.5.5 0 0 1 .5-.5M1 4v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V4z"/>
                        </svg>

                    </label>

                    <span>Date Of Receipt:</span>

                    <!-- Date Picker -->
                    <input
                        type="date"
                        id="receiptDate"
                        class="date-input">

                </div>


               <!-- Amount -->
<div class="detail-item amount">
    <span>Amount:</span>
    <input
        type="number"
        id="amount"
        class="amount-input"
        placeholder="__________"
        step="0.01">
</div>
            </div>

        </div>


        <!-- BODY -->
        <div class="modal-body-custom">

            <p class="upload-note">
                Upload the official receipt in JPG or PNG format.
            </p>


            <!-- UPLOAD BOX -->
            <div class="upload-box">

                <div class="upload-icon">
                    ↑
                </div>

                <p class="upload-title">
                    Attach the Official Receipt Here
                </p>

                <p class="upload-subtitle">
                    JPG or PNG • Maximum file size 5 MB
                </p>

                <label for="receiptFile" class="browse-btn">
                    Browse File
                </label>

                <input
                    type="file"
                    id="receiptFile"
                    accept=".jpg,.jpeg,.png">

                <p id="fileName" class="file-name"></p>

            </div>

        </div>


        <!-- FOOTER -->
        <div class="modal-footer-custom">

            <button
                type="button"
                class="cancel-btn"
                onclick="closeModal()">

                Cancel

            </button>

            <button
                type="button"
                class="submit-btn"
                onclick="submitReceipt()">

                Submit Receipt

            </button>

        </div>

    </div>


    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- Custom JavaScript -->
    <script src="script.js"></script>

</body>
</html>
